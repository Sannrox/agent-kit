[package]
name = "fencing-lease"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Named fencing leases for standalone engines"
publish = false
repository = "https://github.com/Sannrox/agent-kit"

[features]
default = []
postgres = ["dep:postgres"]
kubernetes = ["dep:ureq", "dep:time"]

[dependencies]
postgres = { version = "0.19", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", default-features = false, features = ["formatting", "parsing"], optional = true }
ureq = { version = "2.12", default-features = false, features = ["json", "tls"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
