name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Validate skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/validate-kit.sh
      - name: ShellCheck
        run: shellcheck -S warning scripts/*.sh skills/*/scripts/*.sh
